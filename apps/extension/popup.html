<!doctype html>
<html lang="zh-Hant">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Politics Filter TW</title>
<style>body{font:14px system-ui,sans-serif;width:300px;margin:0;padding:16px}h1{font-size:17px;margin:0 0 14px}.row{display:flex;justify-content:space-between;align-items:center;margin:12px 0}select{max-width:120px}h2{font-size:14px;margin:16px 0 6px}#trusted-authors{padding-left:18px;overflow-wrap:anywhere}#trusted-authors li{margin:6px 0}#trusted-authors button{margin-left:6px}</style></head>
<body>
<h1>Politics Filter TW</h1>
<label class="row"><span>啟用過濾</span><input id="enabled" type="checkbox"></label>
<label class="row"><span>強度</span><select id="strength"><option value="low">Low</option><option value="medium">Medium</option><option value="nuclear">Nuclear ☢️</option></select></label>
<label class="row"><span>Debug 分數</span><input id="debug" type="checkbox"></label>
<p id="stats">載入統計中…</p>
<label class="row"><span>辨識圖片文字（本機 OCR）</span><input id="ocr-enabled" type="checkbox"></label>
<h2>不隱藏的作者</h2>
<ul id="trusted-authors"></ul>
<button id="clear-allowed" type="button">清除「這不是政治內容」例外</button>
<h2>漏擋回報</h2>
<button id="report-miss" type="button">選取漏擋貼文</button>
<p id="report-status">回報只儲存在本機，可自行匯出。</p>
<button id="export-reports" type="button">匯出回報</button>
<button id="clear-reports" type="button">清除回報</button>
<script type="module" src="./popup.js"></script>
</body></html>
